[pytest]
testpaths = tests
asyncio_mode = auto
markers =
    unit: Unit tests (fast, no root required)
    integration: Integration tests (may require root or daemon)
    system: System tests (require full system setup, VM)
    namespace: Tests that create real network namespaces (require root)
    slow: Slow tests that take >1 second
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Async test settings
asyncio_default_fixture_loop_scope = function

# Coverage (optional, for when pytest-cov is installed)
# addopts += --cov=libvpnmanager --cov-report=term --cov-report=html
