[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "libvpnmanager"
version = "0.1.0.dev0"
description = "Multi-tunnel VPN manager with network namespace isolation"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.9"
authors = [
    {name = "Proton VPN Team", email = "contact@protonmail.com"}
]
keywords = ["vpn", "proton", "network", "tunnel", "multi-tunnel"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Operating System :: POSIX :: Linux",
    "Topic :: System :: Networking",
]
dependencies = [
    "dbus-next>=0.2.0",        # Async D-Bus communication
    "pydantic>=2.0.0",          # Data validation and settings
    "asyncstdlib>=3.10.0",      # Async versions of stdlib functions
    "pyroute2>=0.7.0",          # Linux network configuration (optional but helpful)
    "systemd-python>=235",      # For systemd integration (if needed)
    "websockets>=11.0",         # WebSocket transport for cross-platform IPC
]

[project.optional-dependencies]
dev = [
    "mypy>=1.0.0",
    "black>=23.0.0",
    "ruff>=0.0.290",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "build>=0.10.0",
    "twine>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/ProtonVPN/proton-vpn-cli"
Documentation = "https://protonvpn.com/docs"
Repository = "https://github.com/ProtonVPN/proton-vpn-cli.git"
Issues = "https://github.com/ProtonVPN/proton-vpn-cli/issues"

[tool.setuptools]
package-dir = {"" = "."}
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests*", "docs*"]

[tool.setuptools.package-data]
libvpnmanager = ["py.typed"]

[tool.black]
line-length = 88
target-version = ['py39']

[tool.ruff]
target-version = "py39"
line-length = 88
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    " UP", # pyupgrade
]
ignore = []

[tool.ruff.isort]
known-first-party = ["libvpnmanager"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["pyroute2.*", "systemd.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--tb=short",
    "--cov=libvpnmanager",
    "--cov-report=term-missing",
]

[project.scripts]
# Multi-tunnel manager daemon (installed as 'proton-vpn-manager')
proton-vpn-manager = "daemon.daemon:main"

# User-facing CLI for multi-tunnel commands
mtm = "cli.main:cli"

# Adapter executables (discovered by the daemon)
mtm-adapter-proton = "proton_vpn_adapter.cli:main"
mtm-adapter-psiphon = "psiphon_adapter.cli:main"
mtm-adapter-wireguard = "wireguard_adapter.cli:main"
mtm-adapter-dummy = "dummy_adapter.cli:main"
