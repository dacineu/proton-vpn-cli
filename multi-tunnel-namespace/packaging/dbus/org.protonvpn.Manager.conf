<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
  "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Proton VPN Manager D-Bus service policy -->
  <policy user="root">
    <allow own="org.protonvpn.Manager"/>
    <allow send_destination="org.protonvpn.Manager"/>
    <allow receive_sender="org.protonvpn.Manager"/>
  </policy>

  <!-- Allow users in admin groups to call methods via polkit -->
  <policy group="sudo">
    <allow send_destination="org.protonvpn.Manager"/>
  </policy>
  <policy group="wheel">
    <allow send_destination="org.protonvpn.Manager"/>
  </policy>
  <policy group="admin">
    <allow send_destination="org.protonvpn.Manager"/>
  </policy>
  <policy group="adm">
    <allow send_destination="org.protonvpn.Manager"/>
  </policy>

  <!-- Allow all users to receive signals (for UI updates) -->
  <policy user="*">
    <allow receive_sender="org.protonvpn.Manager"/>
  </policy>

  <!-- Deny by default -->
  <policy user="*">
    <deny send_destination="org.protonvpn.Manager"/>
  </policy>
</busconfig>
