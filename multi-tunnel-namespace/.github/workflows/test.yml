name: Tests

on:
  push:
    branches: [main, stable, develop]
  pull_request:
    branches: [main, stable]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          python3-dev \
          libdbus-1-dev \
          pkg-config

    - name: Install libvpnmanager in editable mode
      working-directory: src/libvpnmanager
      run: |
        pip install --upgrade pip
        pip install -e ".[test]"

    - name: Run unit tests
      working-directory: tests
      run: |
        pytest unit/ -v --tb=short

    - name: Run unit tests with coverage
      working-directory: tests
      run: |
        pip install pytest-cov
        pytest unit/ --cov=libvpnmanager --cov-report=xml --cov-report=term

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
      if: matrix.python-version == '3.12'  # Only upload once

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install libvpnmanager
      working-directory: src/libvpnmanager
      run: |
        pip install --upgrade pip
        pip install -e .
        pip install black ruff mypy

    - name: Lint with black
      working-directory: src/libvpnmanager
      run: black --check .

    - name: Lint with ruff
      working-directory: src/libvpnmanager
      run: ruff check .

    - name: Type check with mypy
      working-directory: src/libvpnmanager
      run: mypy src --ignore-missing-imports
      continue-on-error: true  # mypy errors shouldn't fail the build yet
